# XcodeGen spec — run `xcodegen generate` in this directory to produce
# FireMate.xcodeproj (install with `brew install xcodegen`).
name: FireMate
options:
  bundleIdPrefix: com.firemate
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  FireMate:
    type: application
    platform: iOS
    sources:
      - App
      - Theme
      - Assistant
      - Tools
      - Forms
      - Reference
      - Settings
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: FireMate
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: FireMate uses the microphone so you can ask questions by voice.
        NSSpeechRecognitionUsageDescription: FireMate transcribes your voice questions on-device where possible.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.firemate.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Set your Apple ID team in Xcode (Signing & Capabilities) or here:
        # DEVELOPMENT_TEAM: XXXXXXXXXX
        CODE_SIGN_STYLE: Automatic
